# Demo gratuita no Render: SQLite dentro do container, recriado com os dados fictícios a cada deploy.
services:
  - type: web
    name: api-chamados
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_DSN
        value: sqlite:/var/www/app/database/chamados.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: SLA_HOLIDAYS
        value: 2026-10-12,2026-11-02,2026-11-15,2026-11-20,2026-12-25
